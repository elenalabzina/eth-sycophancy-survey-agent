# Example configuration for Linux / Windows WSL2 with vLLM.
# Make a local copy as configs/generator.local.yaml (ignored by Git).
# This is the MODEL NAME exposed by the vLLM server, not a filesystem path.
model: Qwen/Qwen3-14B
api_key_env: null
api_key: local
# vLLM exposes an OpenAI-compatible API at /v1 on the same machine.
base_url: http://127.0.0.1:8080/v1
temperature: 0.65
top_p: 0.85
max_tokens: 700
token_limit_parameter: max_tokens
# Suppress Qwen3's separate reasoning trace in visible responses.
disable_thinking: true
